<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diwali Photos | UPAD</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6f9; color: #16324a; font: 1rem/1.55 system-ui, sans-serif; }
    main { max-width: 60rem; margin: auto; padding: clamp(1rem, 4vw, 2.5rem); }
    header { padding: clamp(1.25rem, 4vw, 2rem); margin: 1rem 0; background: #102e49; color: white; border-radius: .9rem; border-bottom: 4px solid #c69b49; }
    h1 { font: 700 clamp(2rem, 5vw, 3rem)/1.15 Georgia, serif; margin: 0; }
    header p { margin: .65rem 0 0; }
    a { color: #102e49; text-underline-offset: .2em; }
    input { display: block; width: 100%; margin: .35rem 0 1rem; padding: .7rem; font: inherit; border: 1px solid #5e7081; border-radius: .4rem; }
    ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 21rem), 1fr)); gap: .65rem; margin: 0; padding: 0; list-style: none; }
    li { padding: 1rem; background: #fff; border: 1px solid #dfc083; border-radius: .55rem; scroll-margin-top: 1rem; }
    li:target { outline: 3px solid #ad761e; }
    h2 { margin: 0 0 .5rem; }
    h3 { font-size: 1rem; margin: 0; }
    .album { padding: 1rem; margin: 0 0 1rem; border-radius: .55rem; border: 1px solid #dfc083; background: white; }
    .album p { margin: .35rem 0 0; }
    .album a { font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <a href="/">UPAD Community Hub</a>
    <header>
      <h1 data-photo-title>Diwali Photos</h1>
    </header>
    <div data-photo-gallery data-program-id-prefix=""><p role="status">Loading photo galleries…</p></div>
  </main>
  
<script src="/photo-gallery.js" defer></script></body>
</html>
